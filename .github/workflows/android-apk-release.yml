name: Android APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - app/**
      - gradle/**
      - gradlew
      - gradlew.bat
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEYSTORE_B64" ]; then
            echo "Missing ANDROID_SIGNING_KEYSTORE_B64 secret"
            exit 1
          fi
          echo "$ANDROID_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Run tests, coverage gate, and build signed release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/release-keystore.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest jacocoTestReport jacocoTestCoverageVerification assembleRelease -PminCoverage=0.70

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/html

      - name: Generate release metadata
        id: meta
        run: |
          app_name="$(python3 - <<'PY'
          import re
          from pathlib import Path
          xml = Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')
          m = re.search(r'<string\s+name="app_name">(.*?)</string>', xml)
          print(m.group(1) if m else 'VoiceNoteHater')
          PY
          )"
          version_name="$(python3 - <<'PY'
          import re
          from pathlib import Path
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          m = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          print(m.group(1) if m else '0.0.0')
          PY
          )"

          safe_app_name="$(echo "$app_name" | tr '[:space:]' '-' | tr -cd '[:alnum:]._-')"
          short_sha="${GITHUB_SHA::7}"
          timestamp="$(date -u +'%Y%m%d-%H%M%S')"
          tag="apk-${timestamp}-${short_sha}"
          title="${app_name} v${version_name} (${short_sha})"
          apk_name="${safe_app_name}-v${version_name}.apk"

          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/${apk_name}"

          {
            echo "tag=${tag}"
            echo "title=${title}"
            echo "version_name=${version_name}"
            echo "apk_name=${apk_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          generate_release_notes: true
          body: |
            Automated APK release from `${{ github.ref_name }}`.

            - Version: `${{ steps.meta.outputs.version_name }}`
            - Commit: `${{ github.sha }}`
            - Triggered by: `${{ github.actor }}`
            - Compare: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}
          files: |
            app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}
